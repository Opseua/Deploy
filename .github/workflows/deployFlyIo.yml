name: Deploy Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'src/FLY_IO/**'
      - 'src/resources/**'
      - '.dockerignore'
      - '.github/workflows/deployFlyIo.yml'
  workflow_dispatch:

# EVITA DOIS DEPLOYS SIMULTÂNEOS NO MESMO APP
concurrency:
  group: deploy-flyio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar início
        run: curl -s "https://ntfy.sh/${{ secrets.NTFY_CHANNEL }}/publish?title=Deploy&message=Em+andamento+(GitHub+Action)"

      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # CONTEXTO = RAIZ DO REPO ('.'), assim o Docker enxerga 'src/resources'
      - run: flyctl deploy . --config src/FLY_IO/fly.toml --dockerfile src/FLY_IO/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
