# .github/workflows/deployCloudflare.yml

name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/CLOUDFLARE/**'
      - 'src/src/**'
      - '.github/workflows/deployCloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar início
        run: curl -s "https://ntfy.sh/${{ secrets.NTFY_CHANNEL }}/publish?title=Deploy&message=Em+andamento+(GitHub+Actions:+Cloudflare)"

      - uses: actions/checkout@v4

      # wrangler faz o bundle (esbuild) e resolve o import de 'src/src/***'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/CLOUDFLARE/Server
          command: deploy

      - name: Notificar sucesso
        if: success()
        run: curl -s "https://ntfy.sh/${{ secrets.NTFY_CHANNEL }}/publish?title=Deploy&message=Concluído+(GitHub+Actions:+Cloudflare)"

      - name: Notificar falha
        if: failure()
        run: curl -s "https://ntfy.sh/${{ secrets.NTFY_CHANNEL }}/publish?title=Deploy&message=Falhou+(GitHub+Actions:+Cloudflare)"