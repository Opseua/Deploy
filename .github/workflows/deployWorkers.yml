name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'src/CLOUDFLARE/**'
      - 'src/resources/**'
      - '.github/workflows/deployWorkers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler faz o bundle (esbuild) e resolve o import de '../../resources/...'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/CLOUDFLARE/Server
          command: deploy
