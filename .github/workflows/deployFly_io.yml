# .github/workflows/deployFly_io.yml

name: Deploy Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'src/FLY_IO/**'
      - 'src/src/**'
      - '.dockerignore'
      - '.github/workflows/deployFly_io.yml'
  workflow_dispatch:

# EVITA DOIS DEPLOYS SIMULTÂNEOS NO MESMO APP
concurrency:
  group: deploy-flyio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Variável global para todos os passos deste job
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Notificar início
        run: curl -s "https://ntfy.sh/${{ secrets.NTFY_CHANNEL }}/publish?title=Deploy&message=Em+andamento+(GitHub+Action:+Fly.io)"

      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Prepara o segredo no Fly.io antes do deploy
      - name: Configurar Variáveis Seguras
        run: |
          MY_VARS=(
            "confSecurityPass=${{ secrets.confSecurityPass }}"
            "NTFY_CHANNEL=${{ secrets.NTFY_CHANNEL }}"
          )
        
          UPPER_VARS=()
          for item in "${MY_VARS[@]}"; do
            KEY="${item%%=*}"
            VALUE="${item#*=}"
            UPPER_VARS+=("${KEY^^}=$VALUE")
          done
          
          flyctl secrets set "${UPPER_VARS[@]}" --stage --config src/FLY_IO/fly.toml

      # CONTEXTO = RAIZ DO REPO ('.'), assim o Docker enxerga 'src/src/***'
      - run: flyctl deploy . --config src/FLY_IO/fly.toml --dockerfile src/FLY_IO/Dockerfile --remote-only