# {0} → FLY_IO (apenas para expor na WEB via P2P)
# {1} → HP
# {2} → ESTRELAR
# {3} → OPSEUA
# {4} → MARCOS
# {5} → THAYNA

# *** type | "xtcp" → P2P (passa pelo servidor: NÃO) | "tcp" → expor na web (passa pelo servidor: SIM) | "stcp" → relay (passa pelo servidor: SIM) [só funciona localmente e precisa do frpc na origem e destino] 

### CLIENT ###
# frpc.toml

# CONEXÃO: DESTINO
serverAddr = "5.161.52.5" # Fly.io ["149.248.223.192" | "opseua.ddns.net"] (pelo domínio as vezes não consegue de primeira) | Estrelar "5.161.52.5"
auth.method = "token"
auth.token = "{{ .Envs.confSecurityPass }}"
serverPort = 998
natHoleStunServer = "stunserver2025.stunprotocol.org:3478" # Fly.io "149.248.223.192:3478" (necessário rodar o serverStun.js) | Estrelar "5.161.52.5:3478" | Google "stunserver2025.stunprotocol.org:3478"

# CONEXÃO: CONFIGURAÇÕES
transport.dialServerKeepalive = 10 # TEMPO EM SEGUNDOS PARA CHECAR A CONEXÃO
transport.poolCount = 50 # MÁXIMO DE CONEXÕES ABERTAS

# DASHBOARD WEB
webServer.addr = "0.0.0.0"
webServer.user = "Administrator"
webServer.password = "{{ .Envs.confSecurityPass }}"
webServer.port = 999

# LOGS
# log.to = "z_OUTROS/z_logs-frpc.txt"
log.level = "info"
log.maxDays = 3

# NOME CLIENTE
user = "1-FLY_IO"
